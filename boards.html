<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원본 게시판 · 경북에듀잡</title>
<meta name="description" content="경북에듀잡이 수집하는 교육청 채용 게시판 원본 링크 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E3A8A'/%3E%3Cpath d='M16 8.2L25.8 12.8 16 17.4 6.2 12.8 16 8.2z' fill='white'/%3E%3Cpath d='M10.6 15.1v5.2c0 1.75 2.42 3.16 5.4 3.16s5.4-1.41 5.4-3.16v-5.2' stroke='%2393C5FD' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  :root{ --pt:#2563EB; --pt-d:#1D4ED8; --pt-w:#EFF5FF; --bg:#F7F9FC; --card:#FFF; --bd:#E5EAF1;
         --tx:#111C2E; --sub:#5B6B85; --dim:#94A3B8; --r:10px; --r-l:14px; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,sans-serif;
       font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

  .top{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
  .top-in{max-width:900px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo b{font-size:17px;font-weight:800;letter-spacing:-.03em}
  .logo b em{font-style:normal;color:var(--pt)}
  .back{margin-left:auto;height:36px;padding:0 13px;border:1px solid var(--bd);border-radius:var(--r);
        font-size:13.5px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:5px}
  .back:hover{border-color:var(--pt);color:var(--pt)}

  .wrap{max-width:900px;margin:0 auto;padding:22px 20px 60px}
  h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .lead{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:18px}
  .lead b{color:var(--tx)}

  .search{position:relative;margin-bottom:18px}
  .search input{width:100%;height:46px;padding:0 14px 0 40px;border:1px solid var(--bd);
       border-radius:var(--r);background:var(--card);font-size:15px;font-family:inherit;color:var(--tx)}
  .search input:focus{outline:0;border-color:var(--pt);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);display:flex}

  .org{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-l);margin-bottom:10px;
       overflow:hidden}
  .org h2{font-size:15px;font-weight:700;padding:13px 16px 11px;display:flex;align-items:center;gap:8px}
  .org h2 i{font-style:normal;font-size:12px;font-weight:600;color:var(--dim)}
  .org ul{list-style:none;border-top:1px solid #EDF1F6}
  .org li a{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid #F1F5F9;
            font-size:14px}
  .org li:first-child a{border-top:0}
  .org li a:hover{background:var(--pt-w);color:var(--pt-d)}
  .org li a span{flex:1;min-width:0;word-break:keep-all}
  .org li a svg{flex:0 0 auto;color:var(--dim)}
  .org li a:hover svg{color:var(--pt)}
  .empty{padding:36px 16px;text-align:center;color:var(--sub);font-size:14px}
  .foot{margin-top:22px;font-size:12.5px;color:var(--sub);line-height:1.75}
  @media(max-width:520px){ .top-in{height:56px;padding:0 16px} .wrap{padding:18px 16px 60px} }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="./">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="9" fill="#1E3A8A"/>
      <path d="M16 8.2L25.8 12.8 16 17.4 6.2 12.8 16 8.2z" fill="#fff"/>
      <path d="M10.6 15.1v5.2c0 1.75 2.42 3.16 5.4 3.16s5.4-1.41 5.4-3.16v-5.2" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M25.8 12.8v4.6" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <b>경북<em>에듀잡</em></b>
  </a>
  <a class="back" href="./">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
      stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>공고 목록</a>
</div></header>

<div class="wrap">
  <h1>원본 게시판 바로가기</h1>
  <p class="lead">
    경북에듀잡이 매일 수집하는 <b id="cnt">103</b>개 게시판입니다.
    직접 확인하고 싶거나, 이 사이트에 안 보이는 공고를 찾을 때 원본을 여세요.<br>
    수집은 각 게시판의 <b>첫 페이지</b>만 봅니다. 더 지난 공고는 원본에서 페이지를 넘겨야 합니다.
  </p>

  <div class="search">
    <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
    <input id="q" type="search" placeholder="지역 · 게시판 이름 검색 (예: 구미, 채용공고)" autocomplete="off">
  </div>

  <div id="list"></div>

  <p class="foot">
    출처 · 경상북도교육청 및 도내 22개 교육지원청. 링크를 누르면 해당 기관 게시판으로 이동합니다.<br>
    게시판이 새로 생기거나 주소가 바뀌면 이 목록도 갱신해야 합니다.
  </p>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ORDER=['경북교육청','포항','경주','김천','안동','구미','영주','영천','상주','문경','경산','의성',
             '청송','영양','영덕','청도','고령','성주','칠곡','예천','봉화','울진','울릉'];
let DATA=[];
function url_(b){ return 'https://www.gbe.kr/'+b.sysid+'/na/ntt/selectNttList.do?mi='+b.mi+'&bbsId='+b.bbsId; }
function render(q){
  q=(q||'').trim().toLowerCase();
  const by={};
  for(const b of DATA){
    if(q && !(b.org+' '+b.label).toLowerCase().includes(q)) continue;
    (by[b.org]=by[b.org]||[]).push(b);
  }
  const orgs=ORDER.filter(o=>by[o]).concat(Object.keys(by).filter(o=>ORDER.indexOf(o)<0));
  if(!orgs.length){ $('list').innerHTML='<div class="org"><p class="empty">검색 결과가 없습니다.</p></div>'; return; }
  $('list').innerHTML = orgs.map(o=>
    `<section class="org"><h2>${esc(o)}<i>게시판 ${by[o].length}개</i></h2><ul>`+
    by[o].map(b=>`<li><a href="${url_(b)}" target="_blank" rel="noopener">`+
      `<span>${esc(b.label)}</span>`+
      `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">`+
      `<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a></li>`).join('')+
    `</ul></section>`).join('');
}
$('q').oninput=e=>render(e.target.value);
fetch('boards.json').then(r=>r.json()).then(d=>{
  DATA=d; $('cnt').textContent=d.length; render('');
}).catch(()=>{ $('list').innerHTML='<div class="org"><p class="empty">목록을 불러오지 못했습니다.</p></div>'; });
</script>
</body>
</html>
