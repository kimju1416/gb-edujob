<style>
/*FONTS*/
:root{
  color-scheme: dark;
  --bk:#050505; --wh:#F5F5F0; --pk:#FF2E8F; --dim:#8A8A86; --line:#262626;
}
html,body{background:var(--bk);color:var(--wh)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;padding-inline:16px;padding-block:20px 32px;box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;font-size:clamp(22px,3.2vw,34px);letter-spacing:.5px;text-wrap:balance}
h1 b{color:var(--pk);font-weight:400}
.meta{font-family:'DM Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;outline:1px solid var(--line)}
.stage:fullscreen{outline:none}
canvas{display:block;width:100%;height:100%;object-fit:contain}
.big{position:absolute;inset:0;margin:auto;width:clamp(64px,10vw,112px);height:clamp(64px,10vw,112px);border-radius:50%;border:0;background:var(--pk);color:var(--bk);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,46,143,.18),0 0 60px rgba(255,46,143,.5);transition:transform .15s}
.big:hover{transform:scale(1.06)}
.big:focus-visible,.ctl button:focus-visible{outline:3px solid var(--wh);outline-offset:3px}
.big svg{width:38%;height:38%;margin-left:8%}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl button{font:500 13px/1 'DM Mono',ui-monospace,monospace;letter-spacing:1px;background:transparent;color:var(--wh);border:1px solid #3a3a3a;padding:10px 14px;cursor:pointer;text-transform:uppercase}
.ctl button:hover{border-color:var(--pk);color:var(--pk)}
.ctl .grow{flex:1;min-width:120px;height:4px;background:#222;position:relative;cursor:pointer}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 24px;font-size:13px;line-height:1.6;color:#bdbdb8;border-top:1px solid var(--line);padding-top:14px}

@media (prefers-reduced-motion: reduce){.big{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>광평중학교 <b>음악중점반</b></h1>

    <div><b>Beat sync</b>킥·클랩·신스 스탭·멜로디가 울리는 시점 데이터를 그대로 받아서 글자와 도형을 움직입니다.</div>
    <div><b>Facts</b>2021년 경북교육청 음악중점학교 지정 · 3년간 악기 1개 전액 국비 · 창단 35명 → 정기연주회 100여 명</div>
  </div>
</div>

<script>
const EV = /*EVENTS*/null;
const AUDIO_B64 = "/*AUDIO*/";

// ===================== 편집 포인트 =====================
const INSTR = [ // [이름, 계열] S현악 W목관 B금관 P타악 — 실제 개설 악기에 맞게 수정하세요
  ['바이올린','S'],['비올라','S'],['첼로','S'],['콘트라베이스','S'],
  ['플루트','W'],['클라리넷','W'],['오보에','W'],['바순','W'],
  ['트럼펫','B'],['호른','B'],['트롬본','B'],['튜바','B'],
  ['팀파니','P'],['타악기','P'],
];
const FAM = {S:['STRINGS','현악'],W:['WOODWINDS','목관'],B:['BRASS','금관'],P:['PERCUSSION','타악']};
// ======================================================

const W=1920,H=1080, BPM=128, BEAT=60/BPM, BAR=BEAT*4, S16=BEAT/4, DUR=30;
const BK='#050505', WH='#F5F5F0', PK='#FF2E8F', GR='#2E2E2E';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const FF={BHS:"'Black Han Sans','Noto Sans KR',sans-serif", AN:"'Anton',Impact,sans-serif", MO:"'DM Mono',ui-monospace,monospace", NS:"'Noto Sans KR',sans-serif", NSB:"'Noto Sans KR',sans-serif"};
const FW={BHS:'400',AN:'400',MO:'500',NS:'500',NSB:'700'};
const CH=[[55,59,62,67],[54,57,62,66],[52,55,59,64],[52,55,60,64]];

const tb=(bar,s=0)=>bar*BAR+s*S16;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,t0,d)=>clamp((t-t0)/d);
const eOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eInExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const eOutBack=x=>{const c1=2.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eOutCubic=x=>1-Math.pow(1-x,3);
const hash=x=>{const s=Math.sin(x*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const tOf=v=>Array.isArray(v)?v[0]:v;
function last(arr,t){let r=null;for(const v of arr){if(tOf(v)<=t)r=v;else break;}return r}
function env(arr,t,k){const v=last(arr,t);return v==null?0:Math.exp(-(t-tOf(v))*k)}
const isDrop=b=>(b>=2&&b<=9)||(b>=12&&b<=14);

// ---------- drawing helpers ----------
function T(s,x,y,size,o={}){
  const {f='BHS',c=WH,a='center',al=1,sc=1,rot=0,ls=0,stroke=0,base='middle'}=o;
  if(al<=0.001||sc<=0.001)return;
  ctx.save();ctx.globalAlpha*=Math.min(1,al);ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.font=`${FW[f]} ${size}px ${FF[f]}`;ctx.textAlign=a;ctx.textBaseline=base;ctx.letterSpacing=ls+'px';
  if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=c;ctx.lineJoin='round';ctx.strokeText(s,0,0)}
  else{ctx.fillStyle=c;ctx.fillText(s,0,0)}
  ctx.restore();
}
function measure(s,size,f='BHS',ls=0){ctx.save();ctx.font=`${FW[f]} ${size}px ${FF[f]}`;ctx.letterSpacing=ls+'px';const w=ctx.measureText(s).width;ctx.restore();return w}
// 슬램: 크게 → 제자리 (비트에 '쾅')
function slam(s,x,y,size,t,t0,o={}){
  if(t<t0)return;const d=o.d||0.2,p=prog(t,t0,d),from=o.from??0.7;
  T(s,x,y,size,{...o,sc:(o.sc||1)*(1+from*(1-eOutExpo(p))),al:(o.al??1)*Math.min(1,p*5),rot:(o.rot||0)+(o.spin||0)*(1-eOutExpo(p))});
}
// 글자 단위 순차 슬램
function chars(str,x,y,size,t,t0,step,o={}){
  const arr=[...str],ws=arr.map(ch=>measure(ch,size,o.f||'BHS'));
  const total=ws.reduce((a,b)=>a+b,0);let cx=o.a==='left'?x:x-total/2,j=0;
  arr.forEach((ch,i)=>{
    if(ch!==' '){const col=o.color?o.color(i,ch):(o.c||WH);
      slam(ch,cx+ws[i]/2,y,size,t,t0+(o.times?o.times[j]:j*step),{...o,a:'center',c:col,from:o.from??0.9});j++;}
    cx+=ws[i];
  });
}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,fill,stroke,lw=2){if(r<=0)return;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function tri(x,y,r,rot,fill){ctx.beginPath();for(let i=0;i<3;i++){const a=rot+i*Math.PI*2/3-Math.PI/2;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function plus(x,y,r,rot,col,lw=8){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='square';line(-r,0,r,0);line(0,-r,0,r);ctx.restore()}
function notehead(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.rotate(-0.38);ctx.scale(s,s);ctx.beginPath();ctx.ellipse(0,0,28,20,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function eighth(x,y,s,col){ // 8분음표 (도형으로 조립)
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  notehead(0,0,1,col);ctx.fillStyle=col;ctx.fillRect(22,-150,8,152);
  ctx.beginPath();ctx.moveTo(30,-150);ctx.bezierCurveTo(40,-110,90,-100,70,-40);ctx.bezierCurveTo(80,-90,50,-100,30,-110);ctx.closePath();ctx.fill();
  ctx.restore();
}
function marquee(str,y,size,speed,t,o={}){
  const w=measure(str,size,o.f||'AN',o.ls||0);let x=-((t*speed)%w+w)%w;if(speed<0)x=((-t*speed)%w)-w;
  for(let xx=x-w;xx<W+w;xx+=w)T(str,xx,y,size,{...o,a:'left',f:o.f||'AN'});
}
function wipeBar(x,y,w,h,t,t0,col,d=0.24){if(t<t0)return 0;const p=eOutExpo(prog(t,t0,d));ctx.fillStyle=col;ctx.fillRect(x,y,w*p,h);return p}

// ---------- scenes (마디 단위) ----------
function s0(t){ // 들리니?
  const y0=730,g=30;ctx.strokeStyle=WH;ctx.lineWidth=2;
  for(let i=0;i<5;i++){ctx.globalAlpha=.35;const p=eOutExpo(prog(t,i*0.05,1.3));line(0,y0+(i-2)*g,W*p,y0+(i-2)*g)}
  ctx.globalAlpha=1;
  const pos=[-2,0,1,3];
  EV.tick.filter(v=>v<tb(1)).forEach((tt,i)=>{
    if(t<tt)return;const p=prog(t,tt,0.7),x=560+i*270,y=y0-pos[i]*g/1;
    circle(x,y,30+280*eOutExpo(p),null,`rgba(255,46,143,${(1-p)*.9})`,3);
    const s=eOutBack(prog(t,tt,0.22));notehead(x,y,s*1.15,PK);
    ctx.fillStyle=WH;ctx.fillRect(x+26,y-150*s,6,150*s);
  });
  chars('들리니?',960,390,190,t,tb(0,4),S16*1.2,{color:i=>i===3?PK:WH});
  if(t>tb(0,12)){const p=eOutExpo(prog(t,tb(0,12),.3));T('CAN YOU HEAR IT?',960,520+(1-p)*30,40,{f:'MO',c:PK,al:p,ls:10})}
}
function s1(t){ // 너의 중학교 3년, 어떤 소리로 채울래?
  const lt=t-tb(1);
  for(let i=0;i<9;i++){const r=((i*150+lt*lt*520+lt*120)%1350);ctx.globalAlpha=.3*(1-r/1350);circle(960,540,r,null,PK,2)}
  ctx.globalAlpha=1;
  const words=['너의','중학교','3년,'],sz=170;let x=170;
  words.forEach((w,i)=>{const ww=measure(w,sz);slam(w,x+ww/2,400,sz,t,tb(1,i*4),{from:.8});x+=ww+48});
  const s='어떤 소리로 채울래?';const times=[...Array(9)].map((_,j)=>j*S16);
  chars(s,170,640,170,t,tb(1,6),S16,{a:'left',color:i=>(i===3||i===4)?PK:WH});
  if(t>tb(1,12)){const p=eInExpo(prog(t,tb(1,12),BEAT));circle(960,540,p*1250,PK)}
}
function s2(t){ // 광평중 / 음악중점반
  const k=env(EV.kick,t,9),b3=t>=tb(3);
  // 회전 점선 링 + 궤도 삼각형
  ctx.save();ctx.translate(960,540);ctx.rotate(t*0.6);ctx.setLineDash([6,22]);
  circle(0,0,480*eOutExpo(prog(t,tb(2),.5))*(1+.04*k),null,'rgba(255,46,143,.7)',4);ctx.setLineDash([]);ctx.restore();
  for(let i=0;i<5;i++){const a=t*0.9+i*Math.PI*2/5,r=560;if(t>tb(2,i))tri(960+Math.cos(a)*r,540+Math.sin(a)*r*.55,18+10*k,a*2,i%2?WH:PK)}
  if(b3){marquee('MUSIC FOCUS CLASS — GWANGPYEONG — ',140,96,-320,t,{stroke:2,c:PK,ls:4});marquee('광평중학교 음악중점반   ',950,90,280,t,{f:'BHS',stroke:2,c:WH,al:.5})}
  ctx.save();ctx.translate(960,540);ctx.scale(1+.05*k,1+.05*k);ctx.translate(-960,-540);
  ['광','평','중'].forEach((c,i)=>slam(c,600+i*360,470,350,t,tb(2,i*4),{from:1.1,spin:(i-1)*.25}));
  const p=wipeBar(330,650,1260,160,t,tb(2,12),PK);
  if(p>0){ctx.save();ctx.beginPath();ctx.rect(330,650,1260*p,160);ctx.clip();T('음악중점반',960,733,140,{c:BK,ls:6});ctx.restore()}
  ctx.restore();
  // 3마디 클랩 → 흑백 반전 스트로브
  if(b3){const c=last(EV.clap,t);if(c!=null&&c>=tb(3)&&t-c<0.075){ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillRect(-200,-200,W+400,H+400);ctx.globalCompositeOperation='source-over'}}
}
function s3(t){ // 경북 유일
  const k=env(EV.kick,t,9),t1=tb(4,12),cx=1400,cy=540;
  if(t>tb(4)){circle(cx,cy,440*eOutExpo(prog(t,tb(4),.6))*(1+.03*k),null,'rgba(245,245,240,.18)',2)}
  if(t>=t1){
    const ring='ONLY ONE IN GYEONGBUK — MUSIC FOCUS SCHOOL — ';const n=ring.length,show=Math.floor(n*eOutExpo(prog(t,t1,.8)));
    ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*0.35);
    for(let i=0;i<show;i++){ctx.save();ctx.rotate(i/n*Math.PI*2);T(ring[i],0,-380,30,{f:'MO',c:WH,al:.85});ctx.restore()}
    ctx.restore();
    slam('1',cx,cy+40,820,t,t1,{f:'AN',c:PK,from:2.2,sc:1+.04*k});
  }
  if(t<tb(5)){
    slam('경북에서',160+measure('경북에서',130)/2,330,130,t,tb(4),{});
    slam('단',160+measure('단',230)/2,560,230,t,tb(4,4),{});
    slam('하나',160+measure('단 ',230)+measure('하나',230)/2,560,230,t,tb(4,8),{c:PK});
  }else{
    slam('경북 유일',160+measure('경북 유일',150)/2,360,150,t,tb(5),{c:PK});
    chars('음악중점학교',160,550,150,t,tb(5,2),S16,{a:'left'});
    if(t>tb(5,8)){const p=prog(t,tb(5,8),.2);ctx.save();ctx.translate(400,760);ctx.rotate(-.1);const s=1+1.2*(1-eOutExpo(p));ctx.scale(s,s);ctx.globalAlpha=Math.min(1,p*5);
      ctx.strokeStyle=PK;ctx.lineWidth=5;ctx.strokeRect(-230,-60,460,120);T('SINCE 2021',0,4,72,{f:'AN',c:PK,ls:6});ctx.restore()}
    if(t>tb(5,12)){const p=eOutExpo(prog(t,tb(5,12),.3));T('2021. 3  경상북도교육청 음악중점학교 지정',160,905+(1-p)*20,30,{f:'NS',a:'left',al:p*.75})}
  }
}
function s4(t){ // 악기 레슨 0원
  const k=env(EV.kick,t,9);
  // 피아노 건반 (현재 코드 음이 핑크로 점등)
  const ky=870+(1-eOutExpo(prog(t,tb(6),.4)))*240,kw=W/15,stab=last(EV.stab,t);
  const bar=Math.floor(t/BAR),notes=CH[bar%4],on=stab?Math.exp(-(t-stab[0])*5):0;
  const whites=[48,50,52,53,55,57,59,60,62,64,65,67,69,71,72];
  whites.forEach((m,i)=>{ctx.fillStyle=notes.includes(m)&&on>.05?PK:WH;ctx.globalAlpha=notes.includes(m)?.35+.65*on:1;ctx.fillRect(i*kw+2,ky,kw-4,260);ctx.globalAlpha=1});
  const blacks=[[49,0],[51,1],[54,3],[56,4],[58,5],[61,7],[63,8],[66,10],[68,11],[70,12]];
  blacks.forEach(([m,i])=>{ctx.fillStyle=notes.includes(m)&&on>.05?PK:BK;ctx.fillRect((i+1)*kw-kw*.3,ky,kw*.6,150)});
  if(t<tb(7)){
    [['악기 하나,',WH,260],['3년 동안',WH,450],['레슨비는?',PK,640]].forEach(([s,c,y],i)=>slam(s,160+measure(s,170)/2,y,170,t,tb(6,i*4),{c}));
    if(t>tb(6,12)){const d=Math.floor(t/0.045);ctx.save();ctx.beginPath();ctx.rect(1180,160,560,620);ctx.clip();
      T(String(Math.floor(hash(d)*9)+1),1460,470+((t/0.045)%1)*120,640,{f:'AN',c:WH,al:.9});ctx.restore()}
  }else{
    slam('0',840,470,690,t,tb(7),{f:'AN',c:WH,from:1.6,sc:1+.04*k});
    slam('원',1200,560,300,t,tb(7,2),{c:PK});
    const p=wipeBar(420,700,1080,130,t,tb(7,4),PK);
    if(p>0){ctx.save();ctx.beginPath();ctx.rect(420,700,1080*p,130);ctx.clip();T('3년간 악기 1개 · 전액 국비 지원',960,768,66,{c:BK,ls:2});ctx.restore()}
    if(t>tb(7,10)){for(let i=0;i<6;i++){const tt=tb(7,10)+i*S16*.5,p2=prog(t,tt,.6);if(t>tt){const a=hash(i+3)*Math.PI*2;plus(960+Math.cos(a)*(520+200*eOutExpo(p2)),440+Math.sin(a)*(300+120*eOutExpo(p2)),22,p2*3,i%2?PK:WH,8)}}}
  }
}
function famShape(fam,t,t0){
  const lp=t-t0,k=env(EV.kick,t,9);ctx.save();ctx.globalAlpha=.9;
  if(fam==='S'){ctx.strokeStyle=PK;ctx.lineWidth=5;for(let j=0;j<4;j++){const x=720+j*160,a=Math.sin(lp*70+j)*26*Math.exp(-lp*5);ctx.beginPath();ctx.moveTo(x,90);ctx.quadraticCurveTo(x+a,540,x,990);ctx.stroke()}}
  if(fam==='W'){for(let j=0;j<7;j++){const s=eOutBack(prog(lp,j*0.03,.2));circle(510+j*150,540,40*s,j%3===1?PK:null,PK,5)}}
  if(fam==='B'){for(let j=0;j<4;j++){const r=150+j*110+lp*260;circle(960,540,r,null,`rgba(255,46,143,${Math.max(0,.8-j*.18-lp*.8)})`,6)}}
  if(fam==='P'){ctx.save();ctx.translate(960,540);ctx.rotate(lp*1.5+.3);ctx.strokeStyle=PK;ctx.lineWidth=6;const s=440*(1+.08*k);ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore();circle(960,540,120*(1+.2*k),null,WH,4)}
  ctx.restore();
}
function s5(t){ // 악기 속사포
  const t0=tb(8),slot=S16*2,n=INSTR.length,i=Math.floor((t-t0)/slot);

// ---------- player ----------
const POSTER=29.6;
let actx=null,abuf=null,src=null,startAt=0,offset=0,playing=false;
const $=id=>document.getElementById(id);
function fmt(s){s=Math.max(0,Math.min(DUR,s));return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function now(){return playing?Math.min(DUR,actx.currentTime-startAt-(actx.outputLatency||0)):offset}
async function ensureAudio(){
  if(abuf)return;actx=new (window.AudioContext||window.webkitAudioContext)();
  const bin=Uint8Array.from(atob(AUDIO_B64),c=>c.charCodeAt(0));abuf=await actx.decodeAudioData(bin.buffer);
}
async function play(){
  await ensureAudio();if(actx.state==='suspended')await actx.resume();
  if(offset>=DUR-0.05)offset=0;
  src=actx.createBufferSource();src.buffer=abuf;src.connect(actx.destination);
  startAt=actx.currentTime-offset;src.start(0,offset);playing=true;$('bigPlay').hidden=true;$('play').textContent='❚❚ 일시정지';
  src.onended=()=>{if(playing&&now()>=DUR-0.1){playing=false;offset=DUR;ui()}};
}
function pause(){if(!playing)return;offset=now();playing=false;try{src.stop()}catch(e){}ui()}
function ui(){$('play').textContent=playing?'❚❚ 일시정지':'▶ 재생';$('bigPlay').hidden=playing}
function seek(s){const was=playing;pause();offset=clamp(s,0,DUR);render(offset);tick();if(was)play()}
function tick(){const t=now();$('bar').style.width=(t/DUR*100)+'%';$('tc').textContent=fmt(t)+' / 0:30'}
function loop(){if(playing){const t=now();render(t);tick();if(t>=DUR){playing=false;offset=DUR;ui()}}requestAnimationFrame(loop)}
$('bigPlay').onclick=()=>{offset=offset>=DUR-0.05||offset===POSTER?0:offset;play()};
$('play').onclick=()=>{if(playing)pause();else{if(offset===POSTER)offset=0;play()}};
$('restart').onclick=()=>{pause();offset=0;play()};
$('seek').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek((e.clientX-r.left)/r.width*DUR)};
