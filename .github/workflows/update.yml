name: 채용공고 갱신
on:
  schedule:
    - cron: '10 22 * * *'      # 매일 07:10 KST (UTC 22:10 전날)
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 게시판 수집
        run: node collect.mjs

      # 게시판 캐시가 깨졌는지 여기서 먼저 잡는다 (해외에서 자동 발견이 실패한 전례가 있다)
      - name: 수집량 1차 확인
        run: |
          RAW=$(node -e "console.log(JSON.parse(require('fs').readFileSync('jobs-raw.json','utf8')).items.length)")
          echo "1차 수집 $RAW건"
          if [ "$RAW" -lt 300 ]; then echo "::error::수집이 $RAW건뿐입니다. boards.json 캐시나 게시판 구조를 확인하세요."; exit 1; fi

      - name: 상세(마감일) 수집
        run: node detail.mjs

      - name: 데이터 빌드
        run: node build.mjs

      # 게시판 구조가 바뀌면 파서는 에러 없이 0건을 반환한다. 그대로 커밋하면
      # '오늘 공고 0건'인 멀쩡해 보이는 빈 페이지가 배포되고 아무도 눈치채지 못한다.
      - name: 수집 실패 시 중단
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('jobs.json','utf8')).items.length)")
          LIVE=$(node -e "const d=JSON.parse(require('fs').readFileSync('jobs.json','utf8'));console.log(d.items.filter(x=>!x.x).length)")
          echo "전체 $COUNT건 / 모집 중 $LIVE건"
          if [ "$COUNT" -lt 300 ]; then echo "::error::전체 공고가 300건 미만($COUNT). 파서가 깨졌을 수 있어 중단합니다."; exit 1; fi
          if [ "$LIVE"  -lt 50  ]; then echo "::error::모집 중 공고가 50건 미만($LIVE). 확인이 필요합니다."; exit 1; fi

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "채용공고 갱신 $(date -u -d '+9 hours' +'%Y-%m-%d')"
          git push
